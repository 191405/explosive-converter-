<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d4d4d8" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#ffffff" flood-opacity="0.2" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#bgGrad)" stroke="#27272a" stroke-width="8" />
  
  <!-- Inner Subtle Rim -->
  <rect x="24" y="24" width="464" height="464" rx="102" ry="102" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2" />
  
  <!-- Sleek Zap Lightning Bolt -->
  <path 
    d="M 288 72 L 144 264 L 252 264 L 224 440 L 368 248 L 260 248 Z" 
    fill="url(#boltGrad)" 
    stroke="#ffffff" 
    stroke-width="8" 
    stroke-linejoin="round"
    stroke-linecap="round"
    filter="url(#subtleGlow)"
  />
</svg>
